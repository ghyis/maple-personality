<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple Personality Test</title>
<meta name="description" content="Take the Maple Personality Test and discover which MapleStory class best embodies your personality.">

<style>
/* ============================================================
   FONTS
   ============================================================ */
@font-face {
    font-family: 'MapleStory';
    src: url('Maplestory%20Light.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'MapleStory';
    src: url('Maplestory%20Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

/* ============================================================
   DESIGN TOKENS (match result_*.png style)
   ============================================================ */
:root {
    --charcoal:        #2a2f3a;
    --charcoal-2:      #353b48;
    --slate:           #4a5364;
    --white-card:      #ffffff;
    --grey-banner:     #6b7280;
    --grey-banner-2:   #555c69;
    --lime:            #c4e85d;
    --lime-2:          #aed94a;
    --lime-text:       #b9e34e;
    --orange:          #ffaa20;
    --ink:             #2a2218;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'MapleStory', 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
}

body {
    background: linear-gradient(135deg, #fbf1e8 0%, #f6ede0 35%, #ecefdc 70%, #f1f4e7 100%);
    background-attachment: fixed;
    position: relative;
    isolation: isolate;
}

/* ============================================================
   ANIMATED FLOWING / GLOWING GRADIENT BACKGROUND
   ============================================================ */
body::before,
body::after {
    content: '';
    position: fixed;
    inset: -25%;
    z-index: -2;
    pointer-events: none;
    will-change: transform;
}

body::before {
    background:
        radial-gradient(circle at 18% 22%, rgba(255, 220, 195, 0.70), transparent 42%),
        radial-gradient(circle at 78% 28%, rgba(218, 234, 212, 0.60), transparent 48%),
        radial-gradient(circle at 70% 82%, rgba(255, 232, 200, 0.55), transparent 50%),
        radial-gradient(circle at 28% 72%, rgba(208, 230, 218, 0.55), transparent 50%);
    filter: blur(35px);
    animation: flowA 24s ease-in-out infinite alternate;
}
body::after {
    background:
        radial-gradient(circle at 55% 38%, rgba(255, 245, 220, 0.50), transparent 50%),
        radial-gradient(circle at 32% 80%, rgba(225, 240, 220, 0.45), transparent 55%),
        radial-gradient(circle at 88% 60%, rgba(255, 225, 200, 0.45), transparent 50%),
        radial-gradient(circle at 12% 50%, rgba(240, 230, 255, 0.30), transparent 55%);
    filter: blur(55px);
    mix-blend-mode: screen;
    animation: flowB 32s ease-in-out infinite alternate;
}

@keyframes flowA {
    0%   { transform: translate(0%, 0%)   scale(1)    rotate(0deg); }
    50%  { transform: translate(2%, -2%)  scale(1.06) rotate(1.5deg); }
    100% { transform: translate(-3%, 2%)  scale(1.03) rotate(-1deg); }
}
@keyframes flowB {
    0%   { transform: translate(0%, 0%)   scale(1.05) rotate(0deg); }
    50%  { transform: translate(-4%, 3%)  scale(1)    rotate(2deg); }
    100% { transform: translate(3%, -3%)  scale(1.08) rotate(-2deg); }
}

.sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background-image:
        radial-gradient(1.5px 1.5px at 12% 30%, rgba(255,255,255,0.55), transparent 60%),
        radial-gradient(1.2px 1.2px at 70% 18%, rgba(255,255,255,0.45), transparent 60%),
        radial-gradient(1.8px 1.8px at 85% 75%, rgba(255,255,255,0.50), transparent 60%),
        radial-gradient(1.2px 1.2px at 25% 80%, rgba(255,255,255,0.45), transparent 60%),
        radial-gradient(1.5px 1.5px at 55% 55%, rgba(255,255,255,0.40), transparent 60%);
    animation: twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
}

@media (prefers-reduced-motion: reduce) {
    body::before, body::after, .sparkles, .progress-fill::after,
    .result-card-shimmer, .result-card-sparkles span,
    .mystery-panel::after,
    .result-flip-wrap.is-intro,
    #result-loading.is-intro,
    .home-landing-gif { animation: none !important; opacity: 1 !important; }
    #result-loading.is-outro { animation: none !important; opacity: 0 !important; }
    .loading-status.is-visible { animation: none !important; opacity: 1 !important; }

    .result-flip-card:not(.is-flipped):not(.is-revealed):hover .result-flip-inner {
        transform: none;
    }

    .result-flip-wrap.is-revealed:hover .result-flip-inner {
        transform: rotateY(180deg);
    }

    #question-image { transition: none !important; }

    #home.is-leaving,
    #quiz-page.is-entering { transition: none !important; transform: none !important; opacity: 1 !important; }
}

/* ============================================================
   PAGE LAYOUT — viewport-fit, centered
   ============================================================ */
.page {
    height: 100dvh;
    max-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 10px;
    overflow: hidden;
    box-sizing: border-box;
}

/* ============================================================
   TITLE / SUBTITLE
   ============================================================ */
.maple-title {
    display: block;
    width: min(92vw, 680px);
    height: auto;
    max-width: none;
    max-height: none;
    object-fit: contain;
    margin: 0 auto;
    flex-shrink: 0;
    transform: translate(-16px, -22px);
}
.maple-subtitle {
    font-family: 'MapleStory';
    font-weight: 700;
    font-size: clamp(14px, 2.4vh, 18px);
    color: #5c4434;
    text-align: center;
    margin: -14px 0 4px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    flex-shrink: 0;
}

/* ============================================================
   PROGRESS BAR — GREEN, MapleStory experience-bar style
   ============================================================ */
.progress-wrap {
    width: 100%;
    max-width: 640px;
    flex-shrink: 0;
    text-align: center;
}
.progress-header {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 6px;
    font-family: 'MapleStory';
}
.progress-step {
    font-weight: 700;
    font-size: 13px;
    color: var(--charcoal);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
    letter-spacing: 1px;
}
.progress-percent {
    font-weight: 700;
    font-size: 13px;
    color: #8fd926;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
}
.progress-track {
    height: 16px;
    background: linear-gradient(180deg, #2a2f3a 0%, #3d4452 100%);
    border: 2px solid #1c2029;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.35),
        0 2px 0 rgba(255,255,255,0.4);
}
.progress-fill {
    height: 100%;
    background: linear-gradient(180deg, #d6ff5c 0%, #b8ff3a 45%, #8fe824 100%);
    width: 0%;
    transition: width 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 3px rgba(80, 180, 20, 0.35),
        0 0 6px rgba(184, 255, 58, 0.45);
    border-radius: 2px 0 0 2px;
    position: relative;
    overflow: hidden;
}
.progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.55) 50%,
        transparent 100%);
    animation: shine 2.4s infinite;
}
@keyframes shine {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
.progress-notches {
    position: absolute;
    inset: 0;
    display: flex;
    pointer-events: none;
}
.progress-notches span {
    flex: 1;
    border-right: 1px solid rgba(0,0,0,0.2);
}
.progress-notches span:last-child { border-right: none; }

/* ============================================================
   EMPTY IMAGE SLOT (transparent PNG drop target)
   ============================================================ */
.question-image-slot {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(118vw, 860px);
    height: min(112vh, 1020px);
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    pointer-events: none;
    margin: 0;
}
#question-image {
    display: block;
    width: auto;
    height: 100%;
    max-width: min(118vw, 860px);
    max-height: min(112vh, 1020px);
    min-width: min(94vw, 620px);
    min-height: min(94vh, 880px);
    object-fit: contain;
    background: transparent;
    opacity: 0;
    transition: opacity 0.07s ease;
    pointer-events: none;
    margin: 0;
    transform-origin: center center;
}
#question-image.loaded { opacity: 1; }

/* ============================================================
   RESULT-CARD STYLE DIALOG  (matches result_*.png aesthetic)
   Dark charcoal frame · lime-green header · white content card
   ============================================================ */
.card-frame {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    background: var(--charcoal);
    border-radius: 22px;
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    flex-shrink: 0;
    max-height: min(48vh, 400px);
    min-height: 0;
    overflow: visible;
    box-shadow: none;
    filter: none;
}

/* Rounded shadow layer — avoids square clip from parent overflow + filter drop-shadow */
.card-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.1),
        0 10px 24px rgba(0, 0, 0, 0.14);
    pointer-events: none;
    z-index: -1;
}

.card-eyebrow {
    font-family: 'MapleStory';
    font-weight: 700;
    font-size: clamp(11px, 1.6vh, 13px);
    color: var(--lime-text);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: left;
    margin: 2px 4px 0;
    flex-shrink: 0;
}

.card-inner {
    width: 100%;
    background: var(--white-card);
    border-radius: 14px;
    padding: 14px 16px 12px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: visible;
}

.dialog-text {
    font-family: 'MapleStory';
    font-weight: 400;
    font-size: clamp(12px, 1.9vh, 15px);
    line-height: 1.45;
    color: var(--ink);
    margin: 0;
    text-align: center;
    flex-shrink: 0;
}

/* Choices — light glass pill buttons (MapleStory UI reference) */
.choices-list, #choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 0 0 auto;
    overflow-x: hidden;
    overflow-y: visible;
    width: 100%;
    margin: 0;
    padding: 4px 8px 8px;
    align-items: stretch;
    background: transparent;
    border: none;
    border-radius: 12px;
}
.choices {
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(190, 198, 210, 0.55);
    border-radius: 999px;
    padding: 11px 22px 11px 38px;
    font-family: 'MapleStory';
    font-weight: 400;
    font-size: clamp(12px, 1.85vh, 14.5px);
    color: #4a5568;
    cursor: pointer;
    text-align: center;
    position: relative;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    line-height: 1.4;
    display: block;
    flex-shrink: 0;
    text-shadow: none;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    filter: none;
}
.choices::before {
    content: '▸';
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #5a6577;
    font-weight: 700;
    font-size: 13px;
    transition: color 0.15s ease, transform 0.15s ease;
    text-shadow: none;
}
.choices:hover,
.choices:focus-visible {
    color: #2d3748;
    background: rgba(255, 255, 255, 0.98);
    border-color: rgba(170, 180, 195, 0.65);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
}
.choices:hover::before,
.choices:focus-visible::before {
    color: #3d4654;
    transform: translateY(-50%) translateX(2px);
}
.choices:active {
    color: #2d3748;
    background: rgba(255, 255, 255, 1);
    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.06);
}

/* ============================================================
   BUTTONS — separate MapleStory dark menu buttons
   White text default · lime green on hover
   ============================================================ */
.button-row {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    max-width: 640px;
    margin-top: 6px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    padding: 0;
}
.button-row .maple-btn {
    flex: 1;
}
.maple-btn {
    font-family: 'MapleStory';
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    min-width: 110px;
    border: 1px solid #5a636e;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: color 0.12s ease, border-color 0.12s ease;
    background: linear-gradient(180deg, #3a4149 0%, #2c323a 100%);
    color: #ffffff;
    text-shadow: none;
    box-shadow: none;
}
.maple-btn:hover,
.maple-btn:focus-visible {
    color: var(--lime-text);
    border-color: #8fd926;
}
.maple-btn:active {
    color: #d6ff5c;
    border-color: #b8ff3a;
    transform: none;
    box-shadow: none;
}
/* legacy color classes — same separate menu style */
.maple-btn.green,
.maple-btn.orange,
.maple-btn.gray {
    background: linear-gradient(180deg, #3a4149 0%, #2c323a 100%);
    border: 1px solid #5a636e;
    color: #ffffff;
    text-shadow: none;
}
.maple-btn.green:hover,
.maple-btn.orange:hover,
.maple-btn.gray:hover,
.maple-btn.green:focus-visible,
.maple-btn.orange:focus-visible,
.maple-btn.gray:focus-visible {
    color: var(--lime-text);
    border-color: #8fd926;
    background: linear-gradient(180deg, #3a4149 0%, #2c323a 100%);
}

/* ============================================================
   HOME PAGE — uses the card-frame style as well
   ============================================================ */
#home {
    justify-content: center;
    gap: 12px;
    transition: opacity 0.55s ease, transform 0.55s ease;
    overflow-x: hidden;
    overflow-y: auto;
}

#home.is-leaving {
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
}

#quiz-page.is-entering {
    opacity: 0;
}

#quiz-page.is-entering.is-visible {
    opacity: 1;
    transition: opacity 0.45s ease;
}

#home .button-row .maple-btn {
    flex: 0 1 calc((100% - 10px) / 2);
    max-width: calc((640px - 10px) / 2);
}

.home-landing-gif {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    min-height: 0;
    max-height: min(62vh, 520px);
    padding: 4px 0;
    opacity: 0;
    animation:
        landing-gif-fade 2s ease-out forwards,
        landing-gif-bob 24s ease-in-out 2s infinite;
}

.home-landing-gif.is-ready {
    opacity: 1;
}

.home-landing-gif canvas,
.home-landing-gif img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(87.4vw, 494px);
    max-height: min(55.1vh, 456px);
    object-fit: contain;
}

.home-landing-gif canvas[hidden],
.home-landing-gif img[hidden] {
    display: none !important;
}

@keyframes landing-gif-fade {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes landing-gif-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.tag-badge {
    display: inline-block;
    background: linear-gradient(180deg, #c4e85d 0%, #8cc34a 100%);
    border: 1px solid #4a8a4a;
    color: #1f3a1f;
    font-family: 'MapleStory';
    font-weight: 700;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
}

/* ============================================================
   QUIZ PAGE
   ============================================================ */
#quiz-page.page {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    height: 100%;
    max-height: 100dvh;
    overflow: visible;
}

#quiz-page {
    padding: 8px 12px 10px;
    gap: 0;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
    overflow: visible;
}
#quiz {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    flex: 1 1 auto;
    min-height: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 0;
    overflow: visible;
}
.progress-wrap {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    width: 100%;
}
#quest-card {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    margin-top: clamp(18px, 64vh, 560px);
    margin-bottom: 10px;
    width: 100%;
    align-self: stretch;
}

#quiz.is-collect-mode #quest-card {
    margin-top: clamp(14px, 60vh, 520px);
}

/* ============================================================
   RESULTS PAGE — loading sequence → large card → actions
   ============================================================ */
#results {
    justify-content: center;
    gap: 0;
    padding: 16px;
}

.results-shell {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto;
}

#result-loading {
    flex: 0 0 auto;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    margin: 0 auto;
    overflow: visible;
    opacity: 0;
}

#result-loading.is-intro {
    animation: loading-fade-in 0.7s ease forwards;
}

#result-loading.is-outro {
    animation: loading-fade-out 0.55s ease forwards;
}

@keyframes loading-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes loading-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
}

#quiz.is-collect-mode .progress-wrap {
    display: none !important;
}

#quest-card.is-collect-step .card-inner {
    justify-content: flex-start;
    align-items: stretch;
}

#quest-card.is-collect-step #question {
    text-align: center;
    font-weight: 400;
}

#quest-card.is-collect-step .choices-collect {
    margin-top: 4px;
}

#result-loading[hidden] {
    display: none !important;
}

#result-loading::after {
    display: none;
}

#quest-card.card-frame {
    max-height: none;
    flex-shrink: 0;
}

#quest-card .card-inner {
    flex: 0 1 auto;
    min-height: 0;
}

.loading-gif-slot {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 0;
    overflow: visible;
    padding: 0;
    margin: 0;
}

.loading-gif-slot img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(88vw, 290px);
    max-height: min(31vh, 260px);
    object-fit: contain;
    background: transparent;
}

.loading-bar-wrap {
    width: 100%;
    max-width: 640px;
    flex-shrink: 0;
    margin: 0 auto;
}

.loading-bar-track {
    height: 16px;
    background: linear-gradient(180deg, #2a2f3a 0%, #3d4452 100%);
    border: 2px solid #1c2029;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.35),
        0 2px 0 rgba(255, 255, 255, 0.4);
}

.loading-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(180deg, #d6ff5c 0%, #b8ff3a 45%, #8fe824 100%);
    transition: width 0.8s linear;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 3px rgba(80, 180, 20, 0.35),
        0 0 6px rgba(184, 255, 58, 0.45);
    border-radius: 2px 0 0 2px;
    position: relative;
    overflow: hidden;
}

.loading-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 100%);
    animation: shine 2.4s infinite;
}

.loading-bar-notches {
    position: absolute;
    inset: 0;
    display: flex;
    pointer-events: none;
    z-index: 1;
}
.loading-bar-notches span {
    flex: 1;
    border-right: 1px solid rgba(0, 0, 0, 0.22);
}
.loading-bar-notches span:last-child { border-right: none; }

.loading-status {
    font-family: 'MapleStory';
    font-size: clamp(13px, 2vh, 16px);
    color: var(--ink);
    text-align: center;
    margin: 0;
    width: 100%;
    min-height: 1.5em;
    letter-spacing: 0.3px;
    opacity: 0;
}

.loading-status.is-visible {
    animation: loading-text-fade-in 0.55s ease forwards;
}

@keyframes loading-text-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}

#results .results-shell {
    max-width: 720px;
    align-items: center;
}

#result-reveal {
    flex: 0 0 auto;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 12px;
}
#result-reveal[hidden] {
    display: none !important;
}

.result-flip-wrap {
    position: relative;
    flex-shrink: 0;
    margin: 0 auto;
    perspective: 1600px;
    -webkit-perspective: 1600px;
}

.result-flip-wrap.is-intro {
    animation: mystery-card-enter 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes mystery-card-enter {
    0% {
        opacity: 0;
        transform: translateY(100%);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-flip-wrap.is-revealed .result-card-shimmer {
    animation: result-shimmer 9s ease-in-out infinite;
}

.result-flip-wrap.is-revealed .result-card-sparkles span {
    animation: result-sparkle 2.6s ease-in-out infinite;
}

.result-flip-card {
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    cursor: pointer;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    -webkit-tap-highlight-color: transparent;
}

.result-flip-card.is-flipped,
.result-flip-card.is-revealed {
    cursor: default;
    pointer-events: none;
}

.result-flip-inner {
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.95s cubic-bezier(0.45, 0.05, 0.2, 1);
    transform: rotateY(0deg);
    border-radius: 14px;
    will-change: transform;
}

.result-flip-card.is-flipped .result-flip-inner {
    transform: rotateY(180deg);
}

@media (hover: hover) {
    .result-flip-card:not(.is-flipped):not(.is-revealed):hover .mystery-panel {
        border-color: rgba(195, 245, 255, 0.95);
        box-shadow:
            inset 0 0 54px rgba(130, 220, 255, 0.36),
            0 0 36px rgba(85, 185, 255, 0.48);
    }

    .result-flip-card:not(.is-flipped):not(.is-revealed):hover .mystery-hint,
    .result-flip-card:not(.is-flipped):not(.is-revealed):focus-visible .mystery-hint {
        opacity: 1;
        color: rgba(235, 250, 255, 0.95);
        transform: translateX(-50%) translateY(0);
    }

    .result-flip-wrap.is-revealed:hover .result-flip-inner {
        transform: rotateY(180deg) scale(1.008) translateY(-2px);
        transition: transform 0.4s ease;
    }

    .result-flip-wrap.is-revealed:hover .result-card-shimmer {
        opacity: 0.4;
    }
}

.result-flip-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}

.result-flip-front {
    transform: rotateY(0deg) translateZ(3px);
}

.result-flip-back {
    transform: rotateY(180deg) translateZ(3px);
    background: #2a2f3a;
}

.result-card-shine {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
}

.result-card-img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    border-radius: 14px;
    pointer-events: none;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}

.result-card-shimmer {
    position: absolute;
    top: -10%;
    left: -70%;
    width: 55%;
    height: 120%;
    border-radius: inherit;
    opacity: 0;
    background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.07) 38%,
        rgba(255, 255, 255, 0.18) 50%,
        rgba(255, 255, 255, 0.07) 62%,
        rgba(255, 255, 255, 0) 100%
    );
    filter: blur(2px);
    mix-blend-mode: soft-light;
    pointer-events: none;
    will-change: transform, opacity;
}

@keyframes result-shimmer {
    0% {
        transform: translateX(0);
        opacity: 0;
    }
    12% {
        opacity: 0.38;
    }
    50% {
        transform: translateX(260%);
        opacity: 0.38;
    }
    88% {
        opacity: 0;
    }
    100% {
        transform: translateX(260%);
        opacity: 0;
    }
}

.result-card-sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.result-card-sparkles span {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.88);
    box-shadow:
        0 0 8px rgba(255, 255, 255, 0.62),
        0 0 14px rgba(200, 240, 255, 0.42);
    opacity: 0;
    will-change: transform, opacity;
}

@keyframes result-sparkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 0.82; transform: scale(1.3); }
}

.result-card-sparkles span:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
.result-card-sparkles span:nth-child(2) { top: 22%; left: 72%; animation-delay: -0.7s; }
.result-card-sparkles span:nth-child(3) { top: 38%; left: 34%; animation-delay: -1.4s; }
.result-card-sparkles span:nth-child(4) { top: 52%; left: 82%; animation-delay: -2.1s; }
.result-card-sparkles span:nth-child(5) { top: 64%; left: 14%; animation-delay: -0.4s; }
.result-card-sparkles span:nth-child(6) { top: 78%; left: 58%; animation-delay: -1.1s; }
.result-card-sparkles span:nth-child(7) { top: 28%; left: 48%; animation-delay: -1.8s; }
.result-card-sparkles span:nth-child(8) { top: 46%; left: 62%; animation-delay: -2.5s; }
.result-card-sparkles span:nth-child(9) { top: 86%; left: 36%; animation-delay: -0.9s; }
.result-card-sparkles span:nth-child(10) { top: 8%; left: 54%; animation-delay: -1.6s; }

.mystery-panel {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    transform: translateZ(1px);
    background:
        radial-gradient(circle at 50% 42%, rgba(88, 190, 255, 0.38) 0%, transparent 52%),
        radial-gradient(circle at 28% 72%, rgba(45, 130, 220, 0.42) 0%, transparent 48%),
        radial-gradient(circle at 74% 30%, rgba(110, 210, 255, 0.28) 0%, transparent 44%),
        linear-gradient(165deg, #0b4f8c 0%, #1a78b8 36%, #0e5a96 72%, #084773 100%);
    border: 2px solid rgba(145, 230, 255, 0.78);
    box-shadow:
        inset 0 0 48px rgba(120, 210, 255, 0.28),
        0 0 24px rgba(70, 170, 255, 0.35);

}

.mystery-panel-grid {
    position: absolute;
    inset: 0;
    opacity: 0.22;
    background-image:
        linear-gradient(45deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events: none;
}

.mystery-panel-glow {
    position: absolute;
    inset: 8%;
    border: 1px solid rgba(180, 240, 255, 0.18);
    transform: rotate(45deg) scale(0.72);
    pointer-events: none;
}

.mystery-q {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'MapleStory', sans-serif;
    font-weight: 700;
    font-size: clamp(72px, 20vw, 156px);
    line-height: 1;
    color: #fff;
    text-shadow:
        0 0 18px rgba(255, 255, 255, 0.95),
        0 0 42px rgba(170, 230, 255, 0.85),
        0 0 64px rgba(100, 190, 255, 0.55);
    animation: mystery-q-pulse 2.8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes mystery-q-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.92; }
    50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
}

.mystery-hint {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%) translateY(10px);
    margin: 0;
    font-family: 'MapleStory', sans-serif;
    font-weight: 400;
    font-size: clamp(12px, 2vh, 15px);
    color: rgba(235, 250, 255, 0);
    letter-spacing: 0.4px;
    text-shadow: 0 0 10px rgba(90, 180, 255, 0.45);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.35s ease, transform 0.35s ease, color 0.35s ease;
}

.mystery-card-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    overflow: hidden;
}

.mystery-cloud {
    position: absolute;
    border-radius: 50%;
    filter: blur(20px);
    mix-blend-mode: screen;
    animation: mystery-drift 7s ease-in-out infinite;
}

.mystery-cloud-a {
    width: 58%;
    height: 36%;
    top: 16%;
    left: -10%;
    background: radial-gradient(circle, rgba(185, 245, 255, 0.85) 0%, transparent 72%);
}

.mystery-cloud-b {
    width: 52%;
    height: 42%;
    bottom: 8%;
    right: -12%;
    background: radial-gradient(circle, rgba(130, 210, 255, 0.8) 0%, transparent 72%);
    animation-delay: -3.5s;
}

.mystery-cloud-c {
    width: 44%;
    height: 30%;
    top: 42%;
    left: 28%;
    background: radial-gradient(circle, rgba(220, 250, 255, 0.55) 0%, transparent 70%);
    animation-delay: -1.8s;
}

@keyframes mystery-drift {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.42; }
    50% { transform: translate(14px, -10px) scale(1.1); opacity: 0.78; }
}

.mystery-sparkles {
    position: absolute;
    inset: 0;
}

.mystery-sparkles span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.95);
    animation: mystery-sparkle 2.4s ease-in-out infinite;
}

.mystery-sparkles span:nth-child(1) { top: 22%; left: 24%; animation-delay: 0s; }
.mystery-sparkles span:nth-child(2) { top: 34%; left: 68%; animation-delay: -0.6s; }
.mystery-sparkles span:nth-child(3) { top: 48%; left: 18%; animation-delay: -1.2s; }
.mystery-sparkles span:nth-child(4) { top: 58%; left: 74%; animation-delay: -1.8s; }
.mystery-sparkles span:nth-child(5) { top: 70%; left: 42%; animation-delay: -0.3s; }
.mystery-sparkles span:nth-child(6) { top: 28%; left: 46%; animation-delay: -2s; }
.mystery-sparkles span:nth-child(7) { top: 62%; left: 56%; animation-delay: -0.9s; }
.mystery-sparkles span:nth-child(8) { top: 40%; left: 82%; animation-delay: -1.5s; }

@keyframes mystery-sparkle {
    0%, 100% { opacity: 0.15; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.35); }
}

.mystery-panel::after {
    content: '';
    position: absolute;
    top: -10%;
    left: -70%;
    width: 55%;
    height: 120%;
    border-radius: inherit;
    opacity: 0;
    background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.06) 38%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.06) 62%,
        rgba(255, 255, 255, 0) 100%
    );
    filter: blur(2px);
    mix-blend-mode: soft-light;
    pointer-events: none;
    will-change: transform, opacity;
    animation: mystery-shimmer 9s ease-in-out infinite;
}

@keyframes mystery-shimmer {
    0% {
        transform: translateX(0);
        opacity: 0;
    }
    12% {
        opacity: 0.35;
    }
    50% {
        transform: translateX(260%);
        opacity: 0.35;
    }
    88% {
        opacity: 0;
    }
    100% {
        transform: translateX(260%);
        opacity: 0;
    }
}

#result-actions {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

#result-actions.is-visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
}

#result-reveal .button-row {
    width: 100%;
    max-width: none;
    margin-top: 0;
    flex-shrink: 0;
}
#result-reveal .maple-btn {
    flex: 1;
}

.score-debug {
    display: none;
    background: rgba(42, 47, 58, 0.92);
    color: var(--lime-text);
    padding: 12px 16px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: left;
    white-space: pre;
    line-height: 1.6;
    max-width: 360px;
    width: 100%;
}

<body>

<div class="sparkles" aria-hidden="true"></div>

<!-- ============================================================
     HOME PAGE
     ============================================================ -->
<div id="home" class="page">

    <img class="maple-title" src="Title.png?v=3" alt="Maple Personality Test">
    <p class="maple-subtitle">Take the quiz and discover which class best embodies your personality!</p>

    <div class="home-landing-gif" aria-hidden="true">
        <canvas id="home-landing-canvas" hidden></canvas>
        <img id="home-landing-fallback" src="landdinggif.gif" alt="" hidden>
    </div>

    <div class="button-row">
        <button class="maple-btn" id="begin-quiz">BEGIN</button>
    </div>
</div>

<!-- ============================================================
     QUIZ PAGE
       progress bar  →  transparent image slot  →  result-card dialog
     ============================================================ -->
<div id="quiz-page" class="page" style="display:none;">
  <div id="quiz">

    <div class="progress-wrap">
        <div class="progress-header">
            <span class="progress-step" id="progress-label">Q1 / 15</span>
            <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-notches" id="progress-notches"></div>
        </div>

    <div class="question-image-slot">
        <img id="question-image" src="" alt="">
        <img id="question-progress-image" src="" style="display:none;" alt="">
    </div>

    <div class="card-frame" id="quest-card">
        <div class="card-eyebrow">Current Quest</div>
        <div class="card-inner">
            <p class="dialog-text" id="question">Loading question...</p>
            <div class="choices-list" id="choices"></div>
        </div>
    </div>
  </div>
</div>

<!-- ============================================================
     RESULTS PAGE
     ============================================================ -->
<div id="results" class="page" style="display:none;">
  <div class="results-shell">

    <div id="result-loading">
        <div class="loading-gif-slot" id="loading-gif-slot" aria-hidden="true"></div>
        <div class="loading-bar-wrap">
            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
                <div class="loading-bar-notches" id="loading-bar-notches" aria-hidden="true"></div>

        <p class="loading-status" id="loading-status" aria-live="polite"></p>

                                <div class="mystery-cloud mystery-cloud-b"></div>
                                <div class="mystery-cloud mystery-cloud-c"></div>
                                <div class="mystery-sparkles">
                                    <span></span><span></span><span></span><span></span>
                                    <span></span><span></span><span></span><span></span>
                                </div>

                            <div class="result-card-sparkles" aria-hidden="true">
                                <span></span><span></span><span></span><span></span><span></span>
                                <span></span><span></span><span></span><span></span><span></span>

                    </div>

     MUSIC  (on by default, no toggle UI)
     ============================================================ -->

    <source src="Music2.mp3" type="audio/mpeg">
    <source src="Music1.mp3" type="audio/mpeg">
</audio>

<script>
// ============================================================
// Hidden debug score capture (revealed with ?debug=1)
// ============================================================
window.__quizDebug = { scores: {I:0,E:0,S:0,N:0,T:0,F:0,J:0,P:0} };

const _origLog = console.log;
console.log = function(...args) {
    _origLog.apply(console, args);
    if (args[0] === 'Selected choice weight:') {
        const w = args[1] || {};
        const s = window.__quizDebug.scores;
        s.I += (w.introvertScore   || 0);
        s.E += (w.extrovertScore   || 0);
        s.J += (w.judgingScore     || 0);
        s.P += (w.perceivingScore  || 0);
        s.S += (w.sensingScore     || 0);
        s.N += (w.intuitionScore   || 0);
        s.T += (w.thinkingScore    || 0);
        s.F += (w.feelingScore     || 0);
    }
    if (args[0] === 'MBTI Type:') {
        window.__quizDebug.mbti = args[1];
    }
};

const LOADING_LINES = [
    'gathering herbs',
    'brewing potion',
    'polishing meister ring',
    'hammering whetstones',
];

const LOADING_GIF_BY_LINE = {
    'gathering herbs': 'loading gather.gif',
    'brewing potion': 'loading brew.gif',
    'polishing meister ring': 'loading polish.gif',
    'hammering whetstones': 'loading hammer.gif',
};

function setLoadingGif(line) {
    var slot = document.getElementById('loading-gif-slot');
    if (!slot) return;
    slot.innerHTML = '';
    var src = LOADING_GIF_BY_LINE[line];
    if (!src) return;
    var img = document.createElement('img');
    img.src = encodeURI(src);
    img.alt = '';
    slot.appendChild(img);
}

function pickLoadingLine() {
    return LOADING_LINES[Math.floor(Math.random() * LOADING_LINES.length)];
}

function getLoadingDots(step) {
    return '.'.repeat((step % 3) + 1);
}

function getMBTIImageUrl(mbtiTypeString) {
    return MBTI_IMAGE_URLS[mbtiTypeString] || '';
}

const LOADING_DOT_MS = 400;
const LOADING_DONE_MS = 450;
const LOADING_OUTRO_MS = 450;
const LOADING_MIN_TOTAL_MS = 1800;

function randomBetween(min, max) {
    return min + Math.random() * (max - min);
}

function buildRandomBarStops() {
    var segmentCount = 10;
    var weights = [];
    var i;

    for (i = 0; i < segmentCount; i++) {
        weights.push(randomBetween(0.45, 1.85));
    }

    var total = 0;
    for (i = 0; i < segmentCount; i++) total += weights[i];

    var stops = [0];
    var acc = 0;
    for (i = 0; i < segmentCount; i++) {
        acc += (weights[i] / total) * 100;
        stops.push(i === segmentCount - 1 ? 100 : Math.round(acc * 10) / 10);
    }

    for (i = 1; i < stops.length; i++) {
        if (stops[i] <= stops[i - 1]) {
            stops[i] = Math.min(100, stops[i - 1] + randomBetween(4, 11));
        }
    }
    stops[stops.length - 1] = 100;
    return stops;
}

function getBarFillDuration(prevPct, nextPct) {
    var delta = Math.max(0.5, nextPct - prevPct);
    var base = randomBetween(0.016, 0.036) * delta + randomBetween(0.04, 0.12);
    return Math.max(0.08, Math.min(base, 0.55));
}

function runLoadingSequence(statusEl, barEl, onComplete) {
    var loadingEl = document.getElementById('result-loading');
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (loadingEl) {
        loadingEl.classList.remove('is-outro');
        if (reducedMotion) {
            loadingEl.style.opacity = '1';
        } else {
            loadingEl.style.opacity = '';
            requestAnimationFrame(function() {
                loadingEl.classList.add('is-intro');
            });
        }
    }

    var barStops = buildRandomBarStops();
    var stopIndex = 0;
    var loadingLine = pickLoadingLine();
    var dotStep = 0;
    var dotTimer = null;
    var timers = [];
    var finished = false;

    function queueTimeout(fn, delay) {
        var id = setTimeout(fn, delay);
        timers.push(id);
        return id;
    }

    function setBarWidth(target, durationSec) {
        if (!barEl) return;
        barEl.style.transition = 'width ' + durationSec + 's linear';
        barEl.style.width = target + '%';
    }

    function renderLoadingStatus(fadeIn) {
        if (!statusEl) return;
        statusEl.textContent = loadingLine + getLoadingDots(dotStep);
        if (!fadeIn) return;
        statusEl.classList.remove('is-visible');
        void statusEl.offsetWidth;
        statusEl.classList.add('is-visible');
    }

    function clearLoadingTextTimers() {
        if (dotTimer) clearInterval(dotTimer);
        dotTimer = null;
    }

    function startLoadingTextAnim() {
        dotStep = 0;
        setLoadingGif(loadingLine);
        renderLoadingStatus(true);

        dotTimer = setInterval(function() {
            if (finished) return;
            dotStep += 1;
            renderLoadingStatus(false);
        }, LOADING_DOT_MS);
    }

    function finishSequence() {
        if (finished) return;
        finished = true;
        timers.forEach(clearTimeout);
        timers.length = 0;
        clearLoadingTextTimers();
        if (barEl) setBarWidth(100, 0.28);

        var doneMs = reducedMotion ? 350 : LOADING_DONE_MS;
        var outroMs = reducedMotion ? 0 : LOADING_OUTRO_MS;

        setTimeout(function() {
            if (statusEl) statusEl.textContent = 'Done!';

            setTimeout(function() {
                if (loadingEl) {
                    loadingEl.classList.remove('is-intro');
                    if (outroMs === 0) {
                        loadingEl.style.opacity = '0';
                    } else {
                        loadingEl.classList.add('is-outro');
                    }
                }

                setTimeout(onComplete, outroMs || 50);
            }, doneMs);
        }, 220);
    }

    if (barEl) {
        barEl.style.transition = 'none';
        barEl.style.width = '0%';
        void barEl.offsetWidth;
    }

    if (statusEl) statusEl.classList.remove('is-visible');
    startLoadingTextAnim();

    queueTimeout(function() {
        if (!finished && stopIndex < barStops.length - 1) {
            stopIndex = barStops.length - 1;
            setBarWidth(100, 0.28);
            queueTimeout(finishSequence, 280);
        }
    }, LOADING_MIN_TOTAL_MS);

    function advanceBar() {
        if (finished) return;

        if (stopIndex >= barStops.length - 1) {
            finishSequence();
            return;
        }

        var pauseMs = randomBetween(35, 180);
        queueTimeout(function() {
            if (finished) return;

            stopIndex += 1;
            var target = barStops[stopIndex];
            var prev = barStops[stopIndex - 1] || 0;
            var fillSec = getBarFillDuration(prev, target);
            setBarWidth(target, fillSec);

            if (stopIndex >= barStops.length - 1) {
                queueTimeout(finishSequence, fillSec * 1000 + randomBetween(40, 110));
            } else {
                queueTimeout(advanceBar, fillSec * 1000 + randomBetween(25, 90));
            }
        }, pauseMs);
    }

    advanceBar();
}

function unbindMysteryCardTilt(flipCard) {
    if (!flipCard || !flipCard._tiltHandlers) return;
    flipCard.removeEventListener('mousemove', flipCard._tiltHandlers.move);
    flipCard.removeEventListener('mouseleave', flipCard._tiltHandlers.leave);
    flipCard._tiltHandlers = null;
    if (!flipCard.classList.contains('is-flipped')) {
        flipCard.style.transition = '';
        flipCard.style.transform = '';
    }
}

function bindMysteryCardTilt(flipCard) {
    if (!flipCard) return;
    unbindMysteryCardTilt(flipCard);

    if (!window.matchMedia('(hover: hover)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var maxTilt = 4;

    function updateTilt(e) {
        if (flipCard.classList.contains('is-flipped')) return;

        var rect = flipCard.getBoundingClientRect();
        var x = (e.clientX - rect.left) / rect.width - 0.5;
        var y = (e.clientY - rect.top) / rect.height - 0.5;
        var rotateY = x * maxTilt * 2;
        var rotateX = -y * maxTilt * 2;

        flipCard.style.transition = 'transform 0.14s ease-out';
        flipCard.style.transform =
            'rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.01) translateY(-3px)';
    }

    function resetTilt() {
        if (flipCard.classList.contains('is-flipped')) return;
        flipCard.style.transition = 'transform 0.45s ease';
        flipCard.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1) translateY(0)';
    }

    flipCard.addEventListener('mousemove', updateTilt);
    flipCard.addEventListener('mouseleave', resetTilt);
    flipCard._tiltHandlers = { move: updateTilt, leave: resetTilt };
}

function resetResultFlipCard() {
    var flipCard = document.getElementById('result-flip-card');
    var flipWrap = document.getElementById('result-flip-wrap');
    var actions = document.getElementById('result-actions');
    var resultImg = document.getElementById('result-card-img');
    if (flipCard) {
        flipCard.classList.remove('is-flipped', 'is-revealed');
        flipCard.onclick = null;
        flipCard.onkeydown = null;
        flipCard.style.transition = '';
        flipCard.style.transform = '';
    }
    if (flipWrap) {
        flipWrap.classList.remove('is-revealed', 'is-intro');
        flipWrap.style.width = '';
        flipWrap.style.height = '';
    }
    if (flipCard) {
        flipCard.style.width = '';
        flipCard.style.height = '';
    }
    var flipInner = document.getElementById('result-flip-inner');
    if (flipCard) {
        unbindMysteryCardTilt(flipCard);
    }
    if (flipInner) {
        flipInner.style.width = '';
        flipInner.style.height = '';
        flipInner.style.transition = '';
        flipInner.style.transform = '';
    }
    if (actions) actions.classList.remove('is-visible');
    if (resultImg) resultImg.removeAttribute('src');
    var loading = document.getElementById('result-loading');
    if (loading) {
        loading.classList.remove('is-intro', 'is-outro');
        loading.style.opacity = '';
    }
}

function bindResultFlipCard() {
    var flipCard = document.getElementById('result-flip-card');
    var flipWrap = document.getElementById('result-flip-wrap');
    var flipInner = document.getElementById('result-flip-inner');
    var actions = document.getElementById('result-actions');
    if (!flipCard || !flipInner) return;

    function flipCardOver() {
        if (flipCard.classList.contains('is-flipped')) return;

        flipCard.onclick = null;
        flipCard.onkeydown = null;
        unbindMysteryCardTilt(flipCard);
        flipCard.style.transition = '';
        flipCard.style.transform = '';

        flipCard.classList.add('is-flipped');

        flipInner.addEventListener('transitionend', function onFlipEnd(e) {
            if (e.target !== flipInner || e.propertyName !== 'transform') return;
            flipInner.removeEventListener('transitionend', onFlipEnd);
            flipCard.classList.add('is-revealed');
            if (flipWrap) flipWrap.classList.add('is-revealed');
            if (actions) actions.classList.add('is-visible');
        });
    }

    flipCard.onclick = flipCardOver;
    flipCard.onkeydown = function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            flipCardOver();
        }
    };

    bindMysteryCardTilt(flipCard);
}

function setupResultFlipCard(imageURL, preloadImg) {
    var flipCard = document.getElementById('result-flip-card');
    var flipInner = document.getElementById('result-flip-inner');
    var flipWrap = document.getElementById('result-flip-wrap');
    var resultImg = document.getElementById('result-card-img');
    var actions = document.getElementById('result-actions');
    var reveal = document.getElementById('result-reveal');
    if (!flipInner || !resultImg || !imageURL) return;

    var naturalW = (preloadImg && preloadImg.naturalWidth) || 720;
    var naturalH = (preloadImg && preloadImg.naturalHeight) || 900;
    var maxW = reveal ? Math.min(720, reveal.clientWidth || 720) : 720;
    var buttonReserve = 12 + (actions ? actions.offsetHeight : 52);
    var maxH = Math.max(320, window.innerHeight - 130 - buttonReserve);
    var scale = Math.min(maxW / naturalW, maxH / naturalH, 1);
    var displayW = Math.max(1, Math.round(naturalW * scale));
    var displayH = Math.max(1, Math.round(naturalH * scale));

    flipInner.style.width = displayW + 'px';
    flipInner.style.height = displayH + 'px';
    if (flipCard) {
        flipCard.style.width = displayW + 'px';
        flipCard.style.height = displayH + 'px';
    }
    if (flipWrap) {
        flipWrap.style.width = displayW + 'px';
        flipWrap.style.height = displayH + 'px';
    }

    resultImg.src = (preloadImg && preloadImg.src) ? preloadImg.src : imageURL;
    resultImg.alt = 'Your MapleStory personality result';
}

window.showMapleResult = function(mbtiTypeString) {
    var results = document.getElementById('results');
    var loading = document.getElementById('result-loading');
    var reveal = document.getElementById('result-reveal');
    var statusEl = document.getElementById('loading-status');
    var barEl = document.getElementById('loading-bar-fill');
    var resultImg = document.getElementById('result-card-img');
    var imageURL = getMBTIImageUrl(mbtiTypeString);

    var qp = document.getElementById('quiz-page');
    if (qp) qp.style.display = 'none';

    if (!results || !loading || !reveal || !statusEl || !resultImg) return;

    resetResultFlipCard();
    reveal.hidden = true;
    loading.classList.remove('is-intro', 'is-outro');
    loading.style.opacity = '0';
    loading.hidden = false;
    results.style.display = 'flex';

    if (barEl) {
        barEl.style.transition = 'none';
        barEl.style.width = '0%';
    }
    if (statusEl) {
        statusEl.textContent = '';
        statusEl.classList.remove('is-visible');
    }
    setLoadingGif('');

    var preload = new Image();
    var loadingDone = false;
    var imageReady = false;
    var revealed = false;

    function tryRevealResult() {
        if (!loadingDone || !imageReady || revealed) return;
        revealed = true;

        loading.hidden = true;
        loading.classList.remove('is-intro', 'is-outro');
        loading.style.opacity = '';
        reveal.hidden = false;
        setupResultFlipCard(imageURL, preload);
        bindResultFlipCard();

        var flipWrap = document.getElementById('result-flip-wrap');
        if (flipWrap) {
            flipWrap.classList.remove('is-intro');
            requestAnimationFrame(function() {
                flipWrap.classList.add('is-intro');
            });
        }

        window.__quizDebug.mbti = mbtiTypeString;
        renderResultDetails();
    }

    preload.onload = function() { imageReady = true; tryRevealResult(); };
    preload.onerror = function() { imageReady = true; tryRevealResult(); };
    preload.src = imageURL;
    if (preload.complete) {
        imageReady = true;
    }

    runLoadingSequence(statusEl, barEl, function() {
        loadingDone = true;
        tryRevealResult();
    });
};

function renderResultDetails() {
    const mbti = window.__quizDebug.mbti;
    if (!mbti) return;

    const s = window.__quizDebug.scores;
    const dbg = document.getElementById('score-debug');
    if (dbg) {
        dbg.textContent =
            'TYPE: ' + mbti + '\n' +
            '────────────\n' +
            'I:' + s.I + '  E:' + s.E + '  → ' + (s.I > s.E ? 'I' : 'E') + '\n' +
            'S:' + s.S + '  N:' + s.N + '  → ' + (s.S > s.N ? 'S' : 'N') + '\n' +
            'T:' + s.T + '  F:' + s.F + '  → ' + (s.T > s.F ? 'T' : 'F') + '\n' +
            'J:' + s.J + '  P:' + s.P + '  → ' + (s.J > s.P ? 'J' : 'P');
        if (new URLSearchParams(location.search).get('debug') === '1') {
            dbg.style.display = 'block';
        }
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const qimg          = document.getElementById('question-image');
    const progressFill  = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const progressPct   = document.getElementById('progress-percent');
    const notches       = document.getElementById('progress-notches');
    const loadingNotches = document.getElementById('loading-bar-notches');

    if (notches) {
        notches.innerHTML = Array.from({length: 15}, () => '<span></span>').join('');
    }
    if (loadingNotches) {
        loadingNotches.innerHTML = Array.from({length: 10}, () => '<span></span>').join('');
    }

    function syncImageVisibility() {
        if (!qimg) return;
        const src = qimg.getAttribute('src') || '';
        if (qimg.complete && qimg.naturalWidth > 0 && src) {
            qimg.classList.add('loaded');
        } else {
            qimg.classList.remove('loaded');
        }
    }
    if (qimg) {
        qimg.addEventListener('load', syncImageVisibility);
        qimg.addEventListener('error', syncImageVisibility);
    }

    const updateProgress = () => {
        if (!qimg) return;
        syncImageVisibility();
        if (typeof window.updateQuizProgress === 'function') return;
        const src = qimg.getAttribute('src') || '';
        const match = src.match(/(?:personality test chibis q|Q)(\d+)\.(png|jpg|jpeg|gif|webp)/i);
        if (match) {
            const qNum = parseInt(match[1], 10);
            if (progressLabel) progressLabel.textContent = 'Q' + qNum + ' / 15';
            const pct = Math.round(qNum / 15 * 100);
            if (progressFill) progressFill.style.width = pct + '%';
            if (progressPct) progressPct.textContent = pct + '%';
        }
    };
    updateProgress();
    if (qimg) {
        new MutationObserver(updateProgress).observe(qimg, {
            attributes: true, attributeFilter: ['src']
        });
    }
});

// ============================================================
// Music — autoplay when the browser allows (muted first, then unmute)
// ============================================================
(function() {
    const bgm = document.getElementById('bgm-track');
    if (!bgm) return;
    bgm.volume = 0.35;

    let unlocked = false;

    function detachGestureListeners() {
        document.removeEventListener('pointerdown', unlockBgm, true);
        document.removeEventListener('keydown', unlockBgm, true);
    }

    async function unlockBgm() {
        if (unlocked) return;
        bgm.muted = false;
        try {
            await bgm.play();
            unlocked = true;
            detachGestureListeners();
        } catch (_) { /* blocked until next gesture */ }
    }

    async function tryAutoplay() {
        if (unlocked) return;

        bgm.muted = true;
        try {
            await bgm.play();
        } catch (_) {
            return;
        }

        bgm.muted = false;
        try {
            await bgm.play();
            unlocked = true;
            detachGestureListeners();
        } catch (_) {
            bgm.muted = true;
        }
    }

    bgm.addEventListener('canplay', tryAutoplay);
    bgm.addEventListener('loadeddata', tryAutoplay);
    tryAutoplay();

    document.addEventListener('pointerdown', unlockBgm, true);
    document.addEventListener('keydown', unlockBgm, true);

    const beginBtn = document.getElementById('begin-quiz');
    if (beginBtn) {
        beginBtn.addEventListener('click', unlockBgm);
    }
})();

// ============================================================
// Home landing GIF — frame playback slowed (CSS cannot slow GIF loops)
// ============================================================
(function initSlowLandingGif() {
    var wrap = document.querySelector('.home-landing-gif');
    var canvas = document.getElementById('home-landing-canvas');
    var fallback = document.getElementById('home-landing-fallback');
    if (!wrap || !canvas || !fallback) return;

    var SLOW_FACTOR = 5;
    var MIN_FRAME_MS = 90;
    var MAX_FRAME_MS = 1400;
    var stopped = false;

    function revealLanding() {
        wrap.classList.add('is-ready');
    }

    function useFallback() {
        canvas.hidden = true;
        fallback.hidden = false;
        revealLanding();
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        useFallback();
        return;
    }

    if (typeof ImageDecoder === 'undefined') {
        useFallback();
        return;
    }

    fetch(encodeURI('landdinggif.gif'))
        .then(function(res) {
            if (!res.ok) throw new Error('landing gif fetch failed');
            return res.arrayBuffer();
        })
        .then(function(buffer) {
            var decoder = new ImageDecoder({ data: buffer, type: 'image/gif' });
            return decoder.tracks.ready.then(function() {
                var track = decoder.tracks[0];
                if (!track || !track.frameCount) throw new Error('no gif frames');
                return { decoder: decoder, track: track };
            });
        })
        .then(function(ctxBundle) {
            var decoder = ctxBundle.decoder;
            var track = ctxBundle.track;
            var surface = canvas.getContext('2d');
            var frameIndex = 0;

            function playFrame() {
                if (stopped) return;

                decoder.decode({ frameIndex: frameIndex }).then(function(result) {
                    if (frameIndex === 0) {
                        canvas.width = result.image.displayWidth;
                        canvas.height = result.image.displayHeight;
                        fallback.hidden = true;
                        canvas.hidden = false;
                        revealLanding();
                    }

                    surface.clearRect(0, 0, canvas.width, canvas.height);
                    surface.drawImage(result.image, 0, 0, canvas.width, canvas.height);

                    var durationUs = result.image.duration;
                    result.image.close();

                    if (!durationUs || durationUs < 1000) {
                        durationUs = 100000;
                    }

                    var delayMs = (durationUs / 1000) * SLOW_FACTOR;
                    delayMs = Math.max(MIN_FRAME_MS, Math.min(MAX_FRAME_MS, delayMs));

                    frameIndex = (frameIndex + 1) % track.frameCount;
                    setTimeout(playFrame, delayMs);
                }).catch(useFallback);
            }

            playFrame();
        })
        .catch(useFallback);

    window.addEventListener('pagehide', function() {
        stopped = true;
    });
})();

    resetResultFlipCard();

    var results = document.getElementById('results');
    var home = document.getElementById('home');

    if (results) results.style.display = 'none';

        window.restartMapleQuiz();
    }

    var beginBtn = document.getElementById('begin-quiz');
    if (beginBtn) beginBtn.disabled = false;

    document.body.classList.remove('quiz-active');
    window.scrollTo(0, 0);
}
